[package]
name = "pixel-shooter-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
bevy = { version = "0.18", default-features = false, features = ["std", "multi_threaded"] }
crossbeam-channel = "0.5"
futures-util = "0.3"
pixel-shooter-admin-protocol = { path = "../protocols/admin" }
pixel-shooter-game-core = { path = "../game-core" }
pixel-shooter-protocol = { path = "../protocols/game" }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.28"

# 標準出力をログファイルへ向けるために使う（logging.rs）。
[target.'cfg(unix)'.dependencies]
libc = "0.2"
